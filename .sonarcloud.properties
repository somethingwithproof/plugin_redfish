#
# SonarQube Cloud automatic analysis. Analyze the plugin code and leave
# tests/ out: test scripts build fixture SQL and fake servers that the
# production rules are not meant for. sonar.sources takes plain paths;
# the exclusion needs a glob to match the files under tests/.
sonar.sources=.
sonar.exclusions=tests/**
